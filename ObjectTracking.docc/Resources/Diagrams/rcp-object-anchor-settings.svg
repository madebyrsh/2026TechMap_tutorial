<svg xmlns="http://www.w3.org/2000/svg" width="720" height="321" viewBox="0 0 720 321" role="img" aria-labelledby="title description">
  <title id="title">TreasureChestAnchor의 새 추적 대상</title>
  <desc id="description">TreasureChestAnchor의 Anchoring 설정에서 Target은 Object, Anchor Object는 TreasureChest.referenceobject입니다.</desc>
  <rect width="720" height="321" fill="#f6f7f9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#182230">
    <path d="M50 156H670" fill="none" stroke="#bfc8d2" stroke-width="2"/>
    <g font-size="31" fill="#415064">
      <text x="50" y="81">Target</text>
      <text x="50" y="213">Anchor Object</text>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="36" font-weight="600">
      <text x="50" y="128">Object</text>
      <text x="50" y="260" fill="#0056bd">TreasureChest.referenceobject</text>
    </g>
  </g>
</svg>
