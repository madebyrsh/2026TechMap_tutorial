<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Object Anchor 설정</title>
  <desc id="description">TreasureChestAnchor의 Anchoring Component가 Object target과 TreasureChest reference object를 사용하는 관계</desc>
  <rect width="1600" height="900" rx="64" fill="#F4F7FB"/>
  <text x="800" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="60" font-weight="700" fill="#152033">Object Anchor 설정</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="150" y="230" width="1300" height="500" rx="42" fill="#FFFFFF" stroke="#A5B4C8" stroke-width="5"/>
    <rect x="225" y="300" width="470" height="330" rx="32" fill="#DCEFE5" stroke="#3B8A65" stroke-width="6"/>
    <text x="460" y="380" text-anchor="middle" font-size="40" font-weight="700" fill="#152033">TreasureChestAnchor</text>
    <text x="460" y="445" text-anchor="middle" font-size="31" fill="#455A7A">Anchoring Component</text>
    <text x="460" y="510" text-anchor="middle" font-size="29" font-weight="700" fill="#152033">Target</text>
