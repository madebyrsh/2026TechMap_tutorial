    <path d="M735 465 H850" stroke="#63799C" stroke-width="11" stroke-linecap="round"/>
    <path d="M830 439 L865 465 L830 491" fill="none" stroke="#63799C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="890" y="330" width="440" height="270" rx="32" fill="#F0E9F8" stroke="#7755A6" stroke-width="6"/>
    <text x="1110" y="405" text-anchor="middle" font-size="31" font-weight="700" fill="#152033">Anchor Object</text>
    <path d="M1045 450 H1150 L1195 495 V555 H1010 V450 Z" fill="#FFFFFF" stroke="#7755A6" stroke-width="5"/>
    <path d="M1150 450 V495 H1195" fill="none" stroke="#7755A6" stroke-width="5"/>
