<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Object Tracking 문제 진단 흐름</title>
  <desc id="description">인식, Transform, Animation, Occlusion 순서로 실제 결과를 확인하여 문제 위치를 좁히는 흐름</desc>
  <rect width="1600" height="900" rx="64" fill="#F5F7FA"/>
  <text x="800" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="58" font-weight="700" fill="#152033">문제가 처음 나타나는 단계 찾기</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="100" y="165" width="1400" height="650" rx="42" fill="#FFFFFF" stroke="#A5B4C8" stroke-width="5"/>
    <g text-anchor="middle">
      <rect x="155" y="300" width="275" height="190" rx="28" fill="#F0E9F8" stroke="#7755A6" stroke-width="5"/>
      <text x="292" y="365" font-size="35" font-weight="700" fill="#152033">1. 인식</text>
      <text x="292" y="415" font-size="24" fill="#5E457E">Reference Object</text>
      <text x="292" y="450" font-size="24" fill="#5E457E">Viewing Angles</text>
      <rect x="495" y="300" width="275" height="190" rx="28" fill="#DCEFE5" stroke="#3B8A65" stroke-width="5"/>
      <text x="632" y="365" font-size="35" font-weight="700" fill="#152033">2. Transform</text>
      <text x="632" y="415" font-size="24" fill="#225D43">Anchor hierarchy</text>
      <text x="632" y="450" font-size="24" fill="#225D43">local Transform</text>
      <rect x="835" y="300" width="275" height="190" rx="28" fill="#E8F0FC" stroke="#4778B8" stroke-width="5"/>
      <text x="972" y="365" font-size="35" font-weight="700" fill="#152033">3. Animation</text>
      <text x="972" y="415" font-size="24" fill="#244B7C">Pivot · Timelines</text>
      <text x="972" y="450" font-size="24" fill="#244B7C">Behavior</text>
      <rect x="1175" y="300" width="275" height="190" rx="28" fill="#F4E3E3" stroke="#B65B5B" stroke-width="5"/>
      <text x="1312" y="365" font-size="35" font-weight="700" fill="#152033">4. Occlusion</text>
      <text x="1312" y="415" font-size="24" fill="#8C4141">geometry 정렬</text>
      <text x="1312" y="450" font-size="24" fill="#8C4141">Material Slot</text>
    </g>
    <g stroke="#63799C" stroke-width="8" stroke-linecap="round" fill="#63799C">
      <path d="M430 395 H480"/>
      <path d="M480 395 l-20 -13 v26 z" stroke="none"/>
      <path d="M770 395 H820"/>
      <path d="M820 395 l-20 -13 v26 z" stroke="none"/>
      <path d="M1110 395 H1160"/>
      <path d="M1160 395 l-20 -13 v26 z" stroke="none"/>
    </g>
    <rect x="300" y="600" width="1000" height="100" rx="28" fill="#FFF4D8" stroke="#C58A20" stroke-width="5"/>
    <text x="800" y="662" text-anchor="middle" font-size="30" font-weight="700" fill="#704B12">확인되지 않은 첫 단계의 설정부터 점검합니다.</text>
  </g>
</svg>
