<svg xmlns="http://www.w3.org/2000/svg" width="760" height="338" viewBox="0 0 760 338" role="img" aria-labelledby="title description">
<title id="title">문제의 원인을 찾는 순서</title><desc id="description">인식에서 시작해 비행기 위치, 회전, 가림 중 처음 어긋나는 곳의 설정을 확인합니다.</desc>
<rect width="760" height="338" fill="#F2F5F8"/>
<g font-family="-apple-system, sans-serif"><text x="45" y="72" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">1</text><text x="118" y="72" text-anchor="start" font-size="42" font-weight="700" fill="#182434">상자가 인식되나요?</text><path d="M118 96 H713" fill="none" stroke="#c7d1dc" stroke-width="2" /><text x="45" y="145" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">2</text><text x="118" y="145" text-anchor="start" font-size="42" font-weight="700" fill="#182434">비행기 위치가 맞나요?</text><path d="M118 169 H713" fill="none" stroke="#c7d1dc" stroke-width="2" /><text x="45" y="218" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">3</text><text x="118" y="218" text-anchor="start" font-size="42" font-weight="700" fill="#182434">회전이 이어지나요?</text><path d="M118 242 H713" fill="none" stroke="#c7d1dc" stroke-width="2" /><text x="45" y="291" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">4</text><text x="118" y="291" text-anchor="start" font-size="42" font-weight="700" fill="#182434">뒤쪽에서 가려지나요?</text></g>
</svg>
