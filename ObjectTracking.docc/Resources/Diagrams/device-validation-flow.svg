<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Object Tracking 실기기 검증 연결</title>
  <desc id="description">reference object와 Object Anchor가 실제 물체를 인식하고 ToyBiplane, Orbit Animation, Occlusion으로 이어지는 관계</desc>
  <rect width="1600" height="900" rx="64" fill="#F5F7FA"/>
  <text x="800" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="58" font-weight="700" fill="#152033">설정과 실제 결과 연결하기</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="105" y="165" width="1390" height="650" rx="42" fill="#FFFFFF" stroke="#A5B4C8" stroke-width="5"/>
    <g text-anchor="middle">
      <rect x="160" y="260" width="300" height="140" rx="28" fill="#F0E9F8" stroke="#7755A6" stroke-width="5"/>
      <text x="310" y="320" font-size="31" font-weight="700" fill="#152033">.referenceobject</text>
      <text x="310" y="365" font-size="24" fill="#5E457E">인식 데이터</text>
      <rect x="650" y="230" width="300" height="200" rx="28" fill="#DCEFE5" stroke="#3B8A65" stroke-width="6"/>
      <text x="800" y="300" font-size="33" font-weight="700" fill="#152033">TreasureChestAnchor</text>
      <text x="800" y="350" font-size="25" fill="#225D43">실제 물체의</text>
      <text x="800" y="385" font-size="25" fill="#225D43">tracked Transform</text>
      <rect x="1140" y="260" width="300" height="140" rx="28" fill="#F7EEE3" stroke="#B87935" stroke-width="5"/>
      <text x="1290" y="320" font-size="33" font-weight="700" fill="#152033">실제 TreasureChest</text>
      <text x="1290" y="365" font-size="24" fill="#80501F">현실의 추적 대상</text>
      <rect x="360" y="570" width="260" height="130" rx="26" fill="#E8F0FC" stroke="#4778B8" stroke-width="5"/>
      <text x="490" y="630" font-size="31" font-weight="700" fill="#152033">ToyBiplane</text>
      <text x="490" y="670" font-size="23" fill="#244B7C">가상 콘텐츠</text>
      <rect x="670" y="570" width="260" height="130" rx="26" fill="#E8F0FC" stroke="#4778B8" stroke-width="5"/>
      <text x="800" y="630" font-size="31" font-weight="700" fill="#152033">Orbit</text>
      <text x="800" y="670" font-size="23" fill="#244B7C">반복 Animation</text>
      <rect x="980" y="570" width="260" height="130" rx="26" fill="#F4E3E3" stroke="#B65B5B" stroke-width="5"/>
      <text x="1110" y="630" font-size="31" font-weight="700" fill="#152033">Occlusion</text>
      <text x="1110" y="670" font-size="23" fill="#8C4141">깊이 관계</text>
    </g>
    <g stroke="#63799C" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M460 330 H630"/>
      <path d="M1140 330 H970"/>
      <path d="M800 430 V510 H490 V550"/>
      <path d="M800 510 V550"/>
      <path d="M800 510 H1110 V550"/>
    </g>
    <g fill="#63799C">
      <path d="M630 330 l-22 -14 v28 z"/>
      <path d="M970 330 l22 -14 v28 z"/>
      <path d="M490 550 l-14 -22 h28 z"/>
      <path d="M800 550 l-14 -22 h28 z"/>
      <path d="M1110 550 l-14 -22 h28 z"/>
    </g>
  </g>
</svg>
