<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" role="img" aria-labelledby="title description">
<title id="title">Anchor 아래의 Scene 계층</title><desc id="description">ToyBiplane, Pivot, Occlusion은 같은 TreasureChestAnchor의 자식이며, OcclusionTreasureChest는 Occlusion 아래입니다. Orbit Action의 Target과 Pivot은 Scene의 자식 항목이 아니라 참조입니다.</desc>
