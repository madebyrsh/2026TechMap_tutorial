  <rect width="720" height="590" fill="#f6f7f9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#182230">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
        <path d="M0 0L10 5 0 10Z" fill="#0056bd"/>
      </marker>
    </defs>
    <path d="M260 101V506" stroke="#8390a3" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="260" cy="272" r="161" fill="none" stroke="#0056bd" stroke-width="4"/>
    <path d="M413 322A161 161 0 0 0 421 277" fill="none" stroke="#0056bd" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="197" y="214" width="126" height="116" rx="3" fill="#d9dee7" stroke="#586676" stroke-width="3"/>
    <circle cx="260" cy="272" r="6" fill="#182230"/>
    <circle cx="260" cy="111" r="13" fill="#f6f7f9" stroke="#647387" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="260" cy="433" r="13" fill="#0056bd"/>
    <path d="M279 111H461M324 272H461M279 433H461" stroke="#8390a3" stroke-width="2"/>
    <path d="M251 516L260 505 269 516" fill="none" stroke="#647387" stroke-width="3"/>
    <g font-size="34" font-weight="600">
      <text x="482" y="122">뒤: 가림</text>
      <text x="482" y="283">보물상자</text>
      <text x="482" y="445">앞: 보임</text>
    </g>
    <text x="260" y="555" font-size="33" text-anchor="middle" fill="#415064">보는 사람</text>
