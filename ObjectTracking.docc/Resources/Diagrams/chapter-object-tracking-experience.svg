<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Object Tracking 경험 구성 흐름</title>
  <desc id="description">Reference Object를 Reality Composer Pro의 Object Anchor에 연결하고 Swift에서 Scene을 불러오는 흐름</desc>
  <rect width="1600" height="900" rx="64" fill="#F4F7FB"/>
  <text x="800" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="62" font-weight="700" fill="#152033">Object Tracking 경험 구성하기</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <g transform="translate(110 300)">
      <rect width="360" height="260" rx="36" fill="#FFFFFF" stroke="#7755A6" stroke-width="6"/>
      <path d="M145 55 H205 L238 88 V165 H122 V55 Z" fill="#E9E0F7" stroke="#7755A6" stroke-width="6"/>
      <path d="M205 55 V88 H238" fill="none" stroke="#7755A6" stroke-width="6"/>
      <text x="180" y="215" font-size="31" font-weight="700" fill="#152033">.referenceobject</text>
    </g>
    <path d="M505 430 H610" stroke="#63799C" stroke-width="12" stroke-linecap="round"/>
    <path d="M590 403 L625 430 L590 457" fill="none" stroke="#63799C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(650 300)">
      <rect width="360" height="260" rx="36" fill="#FFFFFF" stroke="#3B8A65" stroke-width="6"/>
      <circle cx="180" cy="105" r="65" fill="#DCEFE5" stroke="#3B8A65" stroke-width="6"/>
      <path d="M145 106 L171 132 L218 82" fill="none" stroke="#3B8A65" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="180" y="205" font-size="32" font-weight="700" fill="#152033">Object Anchor</text>
      <text x="180" y="240" font-size="24" fill="#455A7A">Reality Composer Pro</text>
    </g>
    <path d="M1045 430 H1150" stroke="#63799C" stroke-width="12" stroke-linecap="round"/>
    <path d="M1130 403 L1165 430 L1130 457" fill="none" stroke="#63799C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1190 300)">
      <rect width="300" height="260" rx="36" fill="#FFFFFF" stroke="#4778B8" stroke-width="6"/>
      <rect x="84" y="54" width="132" height="108" rx="20" fill="#DCE8F7" stroke="#4778B8" stroke-width="6"/>
      <path d="M110 187 H190" stroke="#4778B8" stroke-width="12" stroke-linecap="round"/>
      <text x="150" y="225" font-size="31" font-weight="700" fill="#152033">RealityView</text>
    </g>
  </g>
  <text x="800" y="690" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="37" fill="#455A7A">추적 대상을 설정하고 RCP Scene을 visionOS에서 활성화합니다.</text>
</svg>
