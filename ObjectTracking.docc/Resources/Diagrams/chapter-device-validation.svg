<svg xmlns="http://www.w3.org/2000/svg" width="760" height="338" viewBox="0 0 760 338" role="img" aria-labelledby="title description">
<title id="title">실기기 확인 순서</title><desc id="description">실물 인식에서 시작해 위치, 반복 회전, 가림을 확인하는 실습 순서입니다.</desc>
<rect width="760" height="338" fill="#F2F5F8"/>
<g font-family="-apple-system, sans-serif"><text x="45" y="72" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">1</text><text x="118" y="72" text-anchor="start" font-size="42" font-weight="700" fill="#182434">실물 인식</text><path d="M118 96 H713" fill="none" stroke="#c7d1dc" stroke-width="2" /><text x="45" y="145" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">2</text><text x="118" y="145" text-anchor="start" font-size="42" font-weight="700" fill="#182434">비행기 위치</text><path d="M118 169 H713" fill="none" stroke="#c7d1dc" stroke-width="2" /><text x="45" y="218" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">3</text><text x="118" y="218" text-anchor="start" font-size="42" font-weight="700" fill="#182434">회전과 반복</text><path d="M118 242 H713" fill="none" stroke="#c7d1dc" stroke-width="2" /><text x="45" y="291" text-anchor="start" font-size="42" font-weight="700" fill="#1767B4">4</text><text x="118" y="291" text-anchor="start" font-size="42" font-weight="700" fill="#182434">가림</text></g>
</svg>
