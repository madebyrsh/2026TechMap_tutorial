      <circle cx="81" cy="344" r="8"/>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="41" font-weight="600">
      <text x="116" y="102">OnAddedToScene</text>
      <text x="116" y="230">LoopOrbitToyBiplane</text>
